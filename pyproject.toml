[project]
name = "agent-plugins-dev"
version = "0.1.0"
description = "Development tooling for the Agent Plugins collection in this repository. Not published or shipped with any plugin."
requires-python = ">=3.12"

# This repo is a uv workspace: each MCP server under `*/servers/*` is its own
# package with its own dependencies, resolved together into one root uv.lock
# so container builds are reproducible. See AGENTS.md.
[tool.uv.workspace]
members = ["*/servers/*"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "ty>=0.0.75",
  "taplo>=0.9",
  "typos>=1.30",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "inline-snapshot>=0.20",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "fastmcp>=3.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "W",     # pycodestyle
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplify
  "N",     # pep8-naming
  "D",     # pydocstyle
  "S",     # bandit (security)
  "ASYNC", # async correctness
  "C4",    # comprehensions
  "PIE",   # misc lints
  "PT",    # pytest style
  "RET",   # return simplification
  "PTH",   # prefer pathlib
  "ARG",   # unused arguments
  "TC",    # type-checking imports
  "ISC",   # implicit str concat
  "RUF",   # ruff-specific (includes RUF100 unused-noqa)
  "A",     # shadowed builtins
  "BLE",   # blind except
  "DTZ",   # naive datetimes
  "ERA",   # commented-out code
  "FA",    # __future__ annotations
  "FLY",   # f-string join
  "FURB",  # refurb
  "G",     # logging format
  "LOG",   # logging misuse
  "PERF",  # performance anti-patterns
  "PGH",   # pygrep hooks
  "PL",    # pylint
  "T10",   # debugger calls
  "T20",   # print
  "TID",   # tidy imports
  "TRY",   # exception handling
]
ignore = [
  "D203",    # conflicts with D211 (no blank line before class docstring)
  "D213",    # conflicts with D212 (multi-line summary on first line)
  "D107",    # __init__ docstring; the class docstring covers it
  "TRY003",  # long messages in exceptions are fine here
  "PLR2004", # magic values: HTTP statuses and small limits read better inline
  "PLR0911", # complexity thresholds are advisory; the CLIs are tested to 98%
  "PLR0912",
  "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, docstrings on every test add noise, and
# runtime imports of Path/pytest read better than TYPE_CHECKING blocks.
"tests/**" = ["S101", "D100", "D102", "D103", "TC001", "TC002", "TC003"]
"*/servers/*/tests/**" = ["S101", "D100", "D102", "D103", "TC001", "TC002", "TC003"]
# Skill scripts and repo tooling are command-line programs: printing is their output.
"**/skills/*/scripts/*.py" = ["T201"]
"scripts/*.py" = ["T201"]
# Migrated verbatim from markbsigler/skills: large single-file CLIs whose behavior is
# documented in SKILL.md and the module docstring, with long usage/help and message
# strings. Public-docstring, line-length and typing-only-import rules are relaxed here
# rather than churning ~3,000 lines of tested code; new code should still comply.
"aha-feature/skills/aha-feature/scripts/*.py" = ["D101", "D102", "D103", "E501", "TC003"]
"tests/test_aha_feature.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"
# `scripts/` is not a package; tests add it to sys.path at runtime, and
# pytest adds `tests/` via `pythonpath`; conftest.py adds the aha-feature scripts.
# Tell ty about all three.
extra-paths = ["scripts", "tests", "aha-feature/skills/aha-feature/scripts"]

[tool.ty.src]
# PEP 723 single-file scripts (skills/*/scripts/, servers/) declare their own
# dependencies inline and are type-checked via `uv run --script` (see
# AGENTS.md), not this repo-wide environment, so they are excluded here to
# avoid false import errors.
exclude = ["**/skills/*/scripts/", "**/servers/"]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename} -"

[tool.pytest.ini_options]
testpaths = ["tests", "*/servers/*/tests"]
# `auto` means async test functions need no per-test decorator, so server
# tests stay boilerplate-free.
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  # importlib import mode lets every server use the same tests/test_server.py
  # basename without module-name collisions, and needs no __init__.py files.
  "--import-mode=importlib",
]
# Makes tests/discovery.py importable regardless of import mode.
pythonpath = ["tests"]
xfail_strict = true
filterwarnings = [
  "error",
  # FastMCP/uvicorn emit deprecation chatter from transitive deps we don't control.
  "default::DeprecationWarning",
]
markers = [
  "slow: exercises a real subprocess or network round trip (deselect with -m 'not slow')",
]

[tool.coverage.run]
# `scripts/*.py` are added to sys.path at runtime (not an installed package),
# and `example_server` is a uv workspace member installed editable into the
# same venv -- both are measurable in-process by path.
source = [
  "scripts",
  "example-plugin/servers/example-server/src",
  "aha-feature/skills/aha-feature/scripts",
  "codebase-diagrams/skills/codebase-diagrams/scripts",
]
branch = true
# Measure scripts that tests run as subprocesses (render_diagrams.py).
patch = ["subprocess"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "^\\s*if __name__ == .__main__.:",
  "^\\s*if TYPE_CHECKING:",
]
